<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OWヒーロースロット</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column console — slot reels on top, control strip, then tabbed panels (BAN / ヒーロー管理 / 履歴) */
:root {
  --bg: #0e1320;
  --panel: #161d2d;
  --panel-2: #1d2639;
  --line: #2a3450;
  --fg: #e9edf5;
  --muted: #8d97ad;
  --accent: #f4a43a;
  --accent-ink: #1b1204;
  --tank: #5ea8ff;
  --dmg: #ff5f6d;
  --sup: #4fd3a0;
  --any: #b9a6ff;
  --danger: #ff6b6b;
  --f-display: "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-ui: "Chakra Petch", "Zen Kaku Gothic New", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100%;
  background-image:
    radial-gradient(1200px 500px at 50% -200px, rgba(244,164,58,.10), transparent 70%),
    linear-gradient(transparent 0 calc(100% - 1px), rgba(255,255,255,.025) 0) ;
  background-size: auto, 100% 32px;
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0; font-family: var(--f-ui); font-weight: 700; letter-spacing: .04em;
  font-size: clamp(22px, 4vw, 30px); line-height: 1.1; text-wrap: balance;
}
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.pool-stat { font-family: var(--f-ui); font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.pool-stat b { color: var(--fg); font-weight: 600; }

/* ---------- mode strip ---------- */
.controls {
  display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  font-family: var(--f-ui); font-weight: 600; font-size: 14px; letter-spacing: .04em;
  background: transparent; color: var(--muted); border: 0; padding: 7px 14px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ctl-label { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-right: 8px; font-family: var(--f-ui); }
.ctl { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.switch input { width: 36px; height: 20px; appearance: none; background: var(--line); border-radius: 999px; position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); background: var(--accent-ink); }
.num { width: 56px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-family: var(--f-ui); font-size: 14px; text-align: center; }
.num:disabled { opacity: .45; }

/* ---------- reels ---------- */
.stage { display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
.reels { display: grid; gap: 12px; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); }
.reels[data-count="1"] { --cols: 1; max-width: 420px; width: 100%; margin: 0 auto; }
.reels[data-count="5"] { --cols: 5; }
.reels[data-count="6"] { --cols: 6; }
@media (max-width: 820px) { .reels[data-count="5"], .reels[data-count="6"] { --cols: 3; } }
@media (max-width: 480px) { .reels[data-count="5"], .reels[data-count="6"] { --cols: 2; } }

.slot {
  --rc: var(--any);
  position: relative; min-width: 0;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px;
  overflow: hidden;
}
.slot[data-role="tank"] { --rc: var(--tank); }
.slot[data-role="damage"] { --rc: var(--dmg); }
.slot[data-role="support"] { --rc: var(--sup); }
.slot::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--rc); }
.slot-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.role-badge {
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  font-family: var(--f-ui); font-weight: 600; font-size: 12px; letter-spacing: .06em;
  color: var(--rc); background: color-mix(in srgb, var(--rc) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--rc) 45%, transparent);
  border-radius: 999px; padding: 2px 9px 2px 6px; cursor: pointer;
}
.role-badge svg { width: 13px; height: 13px; }
.role-badge:hover { background: color-mix(in srgb, var(--rc) 24%, transparent); }
.player {
  flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed transparent;
  color: var(--muted); font-family: var(--f-body); font-size: 13px; padding: 2px 2px; text-align: right;
}
.player:hover, .player:focus { border-bottom-color: var(--line); outline: none; color: var(--fg); }
.window {
  position: relative; height: 92px; border-radius: 8px;
  background: #0a0e18; border: 1px solid #222b40;
  display: grid; place-items: center; overflow: hidden;
  box-shadow: inset 0 10px 18px -10px rgba(0,0,0,.9), inset 0 -10px 18px -10px rgba(0,0,0,.9);
}
.window::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: color-mix(in srgb, var(--rc) 30%, transparent); opacity: 0; }
.slot.spinning .window::after { opacity: 1; }
.hero-name {
  font-family: var(--f-display); font-size: clamp(17px, 2.2vw, 22px); line-height: 1.25;
  text-align: center; padding: 0 6px; word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance;
}
.reels[data-count="1"] .window { height: 130px; }
.reels[data-count="1"] .hero-name { font-size: clamp(26px, 6vw, 36px); }
.slot.spinning .hero-name { filter: blur(.6px); opacity: .75; transform: translateY(-2px); }
.slot.landed .window { border-color: color-mix(in srgb, var(--rc) 60%, transparent); }
.slot.landed .hero-name { animation: land .35s cubic-bezier(.2,1.4,.4,1); color: #fff; }
.hero-name.placeholder { color: #3a4560; font-family: var(--f-ui); font-size: 26px; letter-spacing: .2em; }
.hero-name.empty { color: var(--danger); font-family: var(--f-body); font-size: 14px; font-weight: 700; }
.slot-foot { font-size: 12px; color: var(--muted); min-height: 1.4em; text-align: center; font-family: var(--f-ui); }
.slot-foot.warn { color: var(--accent); }
@keyframes land { 0% { transform: translateY(-14px) scale(.96); } 100% { transform: none; } }

.spin-row { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
.spin {
  font-family: var(--f-ui); font-weight: 700; font-size: 20px; letter-spacing: .24em;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  padding: 14px 54px 14px 60px; cursor: pointer;
  box-shadow: 0 4px 0 #a86512, 0 10px 30px -8px rgba(244,164,58,.55);
  transition: transform .08s, box-shadow .08s;
}
.spin:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86512, 0 6px 20px -8px rgba(244,164,58,.5); }
.spin:disabled { opacity: .6; cursor: wait; }
.hint { color: var(--muted); font-size: 12px; font-family: var(--f-ui); }
kbd { font-family: var(--f-ui); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11px; color: var(--fg); }
.notice { text-align: center; font-size: 13px; color: var(--accent); min-height: 1.4em; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  font-family: var(--f-body); font-weight: 700; font-size: 14px; background: transparent; color: var(--muted);
  border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--f-ui); font-size: 12px; color: var(--muted); margin-left: 4px; }
.panel { padding-top: 16px; display: flex; flex-direction: column; gap: 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel-head p { margin: 0; color: var(--muted); font-size: 13px; max-width: 60ch; }

.btn {
  font-family: var(--f-body); font-weight: 500; font-size: 13px; cursor: pointer;
  background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.confirm { background: var(--danger); color: #1a0505; border-color: var(--danger); font-weight: 700; }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

.role-group { display: flex; flex-direction: column; gap: 10px; }
.role-group h3 {
  margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--f-ui); font-size: 14px; letter-spacing: .1em; font-weight: 600;
}
.role-group h3 .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--rc); }
.role-group h3 .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.role-group h3 .spacer { flex: 1; }
.role-group[data-role="tank"] { --rc: var(--tank); }
.role-group[data-role="damage"] { --rc: var(--dmg); }
.role-group[data-role="support"] { --rc: var(--sup); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--f-body); font-size: 13px; font-weight: 500;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; transition: background .1s;
}
.chip:hover { border-color: var(--rc); }
.chip[aria-pressed="true"] { background: transparent; color: #5a6480; border-style: dashed; text-decoration: line-through; text-decoration-color: var(--danger); }
.chip.recent { box-shadow: inset 0 -2px 0 var(--accent); }

/* manage */
.add-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.input, .select {
  background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 10px; font-family: var(--f-body); font-size: 14px; min-width: 0;
}
.add-form .input { flex: 1 1 180px; }
.input:focus, .select:focus, .num:focus, .btn:focus-visible, .chip:focus-visible, .spin:focus-visible, .tab:focus-visible, .seg button:focus-visible, .role-badge:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
.row { display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--rc); border-radius: 7px; padding: 5px 6px; min-width: 0; }
.row .input { flex: 1; padding: 4px 8px; font-size: 13px; background: transparent; border-color: transparent; }
.row .input:hover { border-color: var(--line); }
.row .select { padding: 3px 4px; font-size: 12px; }

/* history */
.hist { display: flex; flex-direction: column; gap: 6px; list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; gap: 12px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; flex-wrap: wrap; }
.hist li.in-recent { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.hist time { font-family: var(--f-ui); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 7em; }
.hist .picks { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.tag { font-size: 13px; padding: 1px 8px; border-radius: 5px; background: color-mix(in srgb, var(--rc) 14%, transparent); color: var(--fg); border: 1px solid color-mix(in srgb, var(--rc) 35%, transparent); }
.tag small { color: var(--muted); margin-right: 4px; }
.tag[data-role="tank"] { --rc: var(--tank); }
.tag[data-role="damage"] { --rc: var(--dmg); }
.tag[data-role="support"] { --rc: var(--sup); }
.recent-flag { font-family: var(--f-ui); font-size: 11px; color: var(--accent); letter-spacing: .06em; }
.empty-state { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(4,6,12,.72); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; }
.modal h2 { margin: 0; font-size: 16px; }
.modal p { margin: 0; color: var(--muted); font-size: 13px; }
.modal textarea { width: 100%; min-height: 220px; resize: vertical; background: #0a0e18; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 700; font-size: 13px; padding: 8px 16px; border-radius: 999px; z-index: 60; }

@media (prefers-reduced-motion: reduce) {
  .slot.landed .hero-name { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>OW HERO <span>SLOT</span></h1>
      <p class="sub">ロールとBANを決めてSPIN。ヒーローは「ヒーロー管理」から自分で追加できる。</p>
    </div>
    <div class="pool-stat" id="poolStat"></div>
  </header>

  <section class="controls" aria-label="ピック設定">
    <div class="ctl">
      <span class="ctl-label">MODE</span>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="solo">SOLO</button>
        <button type="button" data-mode="5v5">5v5</button>
        <button type="button" data-mode="6v6">6v6</button>
      </div>
    </div>
    <div class="ctl">
      <label class="switch"><input type="checkbox" id="recentOn"> 直近の結果を除外</label>
      <input class="num" type="number" id="recentN" min="1" max="20" aria-label="除外するスピン数">
      <span class="hint">回分</span>
    </div>
    <div class="ctl">
      <label class="switch"><input type="checkbox" id="fastOn"> 演出を短く</label>
    </div>
  </section>

  <section class="stage" aria-label="スロット">
    <div class="reels" id="reels"></div>
    <div class="notice" id="notice" role="status"></div>
    <div class="spin-row">
      <button class="spin" id="spinBtn" type="button">SPIN</button>
      <span class="hint"><kbd>Space</kbd> でも回せる・ロールバッジをクリックで切替</span>
    </div>
  </section>

  <section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="ban" id="tab-ban">BAN<span class="count" id="banCount"></span></button>
      <button class="tab" role="tab" data-tab="manage" id="tab-manage">ヒーロー管理<span class="count" id="heroCount"></span></button>
      <button class="tab" role="tab" data-tab="history" id="tab-history">履歴<span class="count" id="histCount"></span></button>
    </div>

    <div class="panel" id="panel-ban" role="tabpanel">
      <div class="panel-head">
        <p>クリックしたヒーローはスロットに出なくなる。縛りプレイ用に「このロールだけ」も作れる。</p>
        <div class="btn-row"><button class="btn" id="banClear" type="button">BANを全解除</button></div>
      </div>
      <div id="banGroups" class="panel" style="padding-top:0"></div>
    </div>

    <div class="panel" id="panel-manage" role="tabpanel" hidden>
      <form class="add-form" id="addForm">
        <input class="input" id="addName" placeholder="新ヒーローの名前（例：ドミナ）" maxlength="30" autocomplete="off">
        <select class="select" id="addRole" aria-label="ロール">
          <option value="tank">タンク</option>
          <option value="damage" selected>ダメージ</option>
          <option value="support">サポート</option>
        </select>
        <button class="btn primary" type="submit">追加</button>
      </form>
      <div class="panel-head">
        <p>名前はその場で書き換えOK。ロール変更・削除もここで。設定はこのブラウザに保存される。</p>
        <div class="btn-row">
          <button class="btn" id="exportBtn" type="button">書き出し</button>
          <button class="btn" id="importBtn" type="button">読み込み</button>
          <button class="btn danger" id="resetBtn" type="button">初期リストに戻す</button>
        </div>
      </div>
      <div id="manageGroups" class="panel" style="padding-top:0"></div>
    </div>

    <div class="panel" id="panel-history" role="tabpanel" hidden>
      <div class="panel-head">
        <p>新しい順に最大50件。オレンジ枠は「直近除外」の対象になってるスピン。</p>
        <div class="btn-row"><button class="btn danger" id="histClear" type="button">履歴を消す</button></div>
      </div>
      <ul class="hist" id="histList"></ul>
    </div>
  </section>
</div>

<div class="modal-bg" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <p id="modalDesc"></p>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div class="btn-row" style="justify-content:flex-end">
      <button class="btn" id="modalClose" type="button">閉じる</button>
      <button class="btn primary" id="modalAction" type="button"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const ROLES = ["tank", "damage", "support"];
  const ROLE_JP = { tank: "タンク", damage: "ダメージ", support: "サポート", any: "全ロール" };
  const ROLE_EN = { tank: "TANK", damage: "DAMAGE", support: "SUPPORT", any: "ANY" };
  const ICON = {
    tank: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1 2 3.5V8c0 3.3 2.6 6 6 7 3.4-1 6-3.7 6-7V3.5L8 1Z"/></svg>',
    damage: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="4.5"/><path d="M8 0v4M8 12v4M0 8h4M12 8h4"/></svg>',
    support: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 1h4v5h5v4h-5v5H6v-5H1V6h5z"/></svg>',
    any: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="4" cy="4" r="2.5"/><circle cx="12" cy="4" r="2.5"/><circle cx="8" cy="12" r="2.5"/></svg>'
  };
  const FORMATS = {
    solo: ["any"],
    "5v5": ["tank", "damage", "damage", "support", "support"],
    "6v6": ["tank", "tank", "damage", "damage", "support", "support"]
  };
  const DEFAULT_HEROES = {
    tank: ["D.Va", "D.Mon", "オリーサ", "ウィンストン", "ザリア", "シグマ", "ジャンカー・クイーン", "ドゥームフィスト", "ドミナ", "ハザード", "マウガ", "ラインハルト", "ラマットラ", "レッキング・ボール", "ロードホッグ"],
    damage: ["アッシュ", "アンラン", "ウィドウメイカー", "ヴェンデッタ", "エコー", "エムレ", "キャスディ", "ゲンジ", "シエラ", "シオン", "シンメトラ", "ジャンクラット", "ソジョーン", "ソルジャー76", "ソンブラ", "トールビョーン", "トレーサー", "ハンゾー", "バスティオン", "ファラ", "フレイヤ", "ベンチャー", "メイ", "リーパー"],
    support: ["アナ", "イラリー", "ウーヤン", "キリコ", "ジェットパック・キャット", "ジュノ", "ゼニヤッタ", "バティスト", "ブリギッテ", "マーシー", "ミズキ", "モイラ", "ライフウィーバー", "ルシオ"]
  };
  const KEY = "ow-hero-slot-v1";
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  const defaultHeroList = () => ROLES.flatMap(r => DEFAULT_HEROES[r].map(name => ({ id: uid(), name, role: r })));

  const fresh = () => ({
    heroes: defaultHeroList(),
    bans: [],
    mode: "5v5",
    slotRoles: { solo: [...FORMATS.solo], "5v5": [...FORMATS["5v5"]], "6v6": [...FORMATS["6v6"]] },
    players: ["", "", "", "", "", ""],
    recentOn: true,
    recentN: 3,
    fast: false,
    history: [],
    tab: "ban"
  });

  let S;
  try {
    const raw = localStorage.getItem(KEY);
    S = raw ? Object.assign(fresh(), JSON.parse(raw)) : fresh();
  } catch (e) { S = fresh(); }
  if (!Array.isArray(S.heroes) || !S.heroes.length) S.heroes = defaultHeroList();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const heroById = id => S.heroes.find(h => h.id === id);
  const banned = () => new Set(S.bans);
  const recentSet = () => {
    const set = new Set();
    if (!S.recentOn) return set;
    S.history.slice(0, S.recentN).forEach(e => e.picks.forEach(p => p.heroId && set.add(p.heroId)));
    return set;
  };
  const jpCollator = new Intl.Collator("ja");
  const byName = (a, b) => jpCollator.compare(a.name, b.name);

  let toastTimer;
  const toast = msg => {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 1800);
  };

  // two-step confirm buttons (no confirm() in this frame)
  const armConfirm = (btn, label, fn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.armed) {
        delete btn.dataset.armed; btn.classList.remove("confirm"); btn.textContent = btn.dataset.orig; fn();
        return;
      }
      btn.dataset.orig = btn.textContent; btn.dataset.armed = "1";
      btn.classList.add("confirm"); btn.textContent = label;
      setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove("confirm"); btn.textContent = btn.dataset.orig; } }, 3000);
    });
  };

  /* ---------- reels ---------- */
  const reelsEl = $("reels");
  let lastResult = null; // array of picks shown
  function renderReels() {
    const roles = S.slotRoles[S.mode];
    reelsEl.dataset.count = roles.length;
    reelsEl.innerHTML = roles.map((r, i) => {
      const p = lastResult && lastResult[i];
      let nameHtml = '<div class="hero-name placeholder">? ? ?</div>';
      if (p) nameHtml = p.heroId ? `<div class="hero-name">${esc(p.name)}</div>` : '<div class="hero-name empty">候補なし</div>';
      const pl = S.mode === "solo" ? "" : `<input class="player" id="player-${i}" value="${esc(S.players[i] || "")}" placeholder="P${i + 1}" maxlength="16" aria-label="プレイヤー${i + 1}の名前">`;
      return `<div class="slot ${p ? "landed-static" : ""}" data-role="${r}" data-i="${i}">
        <div class="slot-top">
          <button type="button" class="role-badge" data-i="${i}" title="クリックでロール切替">${ICON[r]}${ROLE_EN[r]}</button>
          ${pl}
        </div>
        <div class="window">${nameHtml}</div>
        <div class="slot-foot ${p && p.relaxed ? "warn" : ""}">${p && p.relaxed ? "直近除外を無視して抽選" : (p && p.heroId ? ROLE_JP[p.role] : "")}</div>
      </div>`;
    }).join("");
  }
  reelsEl.addEventListener("click", e => {
    const b = e.target.closest(".role-badge"); if (!b || spinning) return;
    const i = +b.dataset.i, order = ["tank", "damage", "support", "any"];
    const roles = S.slotRoles[S.mode];
    roles[i] = order[(order.indexOf(roles[i]) + 1) % order.length];
    lastResult = null; save(); renderReels(); renderStats();
  });
  reelsEl.addEventListener("input", e => {
    if (!e.target.classList.contains("player")) return;
    S.players[+e.target.id.split("-")[1]] = e.target.value; save();
  });

  /* ---------- pick logic ---------- */
  function draw() {
    const roles = S.slotRoles[S.mode];
    const ban = banned(), recent = recentSet(), used = new Set();
    const result = new Array(roles.length);
    // role-locked slots first so "any" slots don't steal the last tank, etc.
    const order = roles.map((r, i) => i).sort((a, b) => (roles[a] === "any") - (roles[b] === "any"));
    for (const i of order) {
      const r = roles[i];
      const base = S.heroes.filter(h => (r === "any" || h.role === r) && !ban.has(h.id) && !used.has(h.id));
      let pool = base.filter(h => !recent.has(h.id)), relaxed = false;
      if (!pool.length && base.length) { pool = base; relaxed = true; }
      if (!pool.length) { result[i] = { heroId: null, name: null, role: r, relaxed: false, pool: [] }; continue; }
      const h = pool[Math.floor(Math.random() * pool.length)];
      used.add(h.id);
      result[i] = { heroId: h.id, name: h.name, role: h.role, relaxed, pool: base };
    }
    return result;
  }

  let spinning = false;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function spin() {
    if (spinning) return;
    const result = draw();
    const roles = S.slotRoles[S.mode];
    spinning = true; $("spinBtn").disabled = true; $("notice").textContent = "";
    const slots = [...reelsEl.querySelectorAll(".slot")];
    const fast = S.fast || reduced;
    const baseT = fast ? 250 : 900, step = fast ? 90 : 320;
    let done = 0;
    slots.forEach((el, i) => {
      el.classList.remove("landed"); el.classList.add("spinning");
      const nameEl = el.querySelector(".hero-name");
      const foot = el.querySelector(".slot-foot");
      foot.textContent = ""; foot.classList.remove("warn");
      nameEl.className = "hero-name";
      const pool = result[i].pool.length ? result[i].pool : S.heroes;
      let k = Math.floor(Math.random() * pool.length);
      const tick = setInterval(() => { k = (k + 1 + Math.floor(Math.random() * 3)) % pool.length; nameEl.textContent = pool[k].name; }, 55);
      setTimeout(() => {
        clearInterval(tick);
        const p = result[i];
        el.classList.remove("spinning"); void el.offsetWidth; el.classList.add("landed");
        if (p.heroId) { nameEl.textContent = p.name; foot.textContent = p.relaxed ? "直近除外を無視して抽選" : ROLE_JP[p.role]; foot.classList.toggle("warn", p.relaxed); }
        else { nameEl.textContent = "候補なし"; nameEl.className = "hero-name empty"; foot.textContent = "BANを減らしてね"; foot.classList.add("warn"); }
        if (++done === slots.length) finish(result, roles);
      }, baseT + i * step);
    });
  }
  function finish(result, roles) {
    lastResult = result.map(p => ({ heroId: p.heroId, name: p.name, role: p.role, relaxed: p.relaxed }));
    S.history.unshift({
      t: Date.now(), mode: S.mode,
      picks: result.map((p, i) => ({ heroId: p.heroId, name: p.name, role: p.role, slotRole: roles[i], player: S.mode === "solo" ? "" : (S.players[i] || "") }))
    });
    S.history = S.history.slice(0, 50);
    save();
    spinning = false; $("spinBtn").disabled = false;
    if (result.some(p => p.relaxed)) $("notice").textContent = "候補が足りなかった枠は、直近除外を外して抽選したよ";
    if (result.some(p => !p.heroId)) $("notice").textContent = "候補が0人の枠がある。BANかロール設定を見直してね";
    renderHistory(); renderBan(); renderStats();
  }
  $("spinBtn").addEventListener("click", spin);
  document.addEventListener("keydown", e => {
    if (e.code !== "Space" || e.repeat) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (["input", "textarea", "select", "button"].includes(tag) || !$("modal").hidden) return;
    e.preventDefault(); spin();
  });

  /* ---------- controls ---------- */
  function renderControls() {
    document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
    $("recentOn").checked = S.recentOn; $("recentN").value = S.recentN; $("recentN").disabled = !S.recentOn;
    $("fastOn").checked = S.fast;
  }
  $("modeSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || spinning) return;
    S.mode = b.dataset.mode; lastResult = null; save(); renderControls(); renderReels(); renderStats();
  });
  $("recentOn").addEventListener("change", e => { S.recentOn = e.target.checked; save(); renderControls(); renderBan(); renderHistory(); renderStats(); });
  $("recentN").addEventListener("change", e => {
    S.recentN = Math.min(20, Math.max(1, parseInt(e.target.value, 10) || 3)); save(); renderControls(); renderBan(); renderHistory(); renderStats();
  });
  $("fastOn").addEventListener("change", e => { S.fast = e.target.checked; save(); });

  function renderStats() {
    const ban = banned(), recent = recentSet();
    const avail = r => S.heroes.filter(h => h.role === r && !ban.has(h.id) && !recent.has(h.id)).length;
    $("poolStat").innerHTML = ROLES.map(r => `<span>${ROLE_JP[r]} <b>${avail(r)}</b>/${S.heroes.filter(h => h.role === r).length}</span>`).join("") + `<span style="opacity:.7">抽選可能 / 登録数</span>`;
    $("banCount").textContent = S.bans.length ? S.bans.length : "";
    $("heroCount").textContent = S.heroes.length;
    $("histCount").textContent = S.history.length || "";
  }

  /* ---------- tabs ---------- */
  function renderTabs() {
    ["ban", "manage", "history"].forEach(t => {
      $("tab-" + t).setAttribute("aria-selected", S.tab === t);
      $("panel-" + t).hidden = S.tab !== t;
    });
  }
  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return; S.tab = b.dataset.tab; save(); renderTabs();
  });

  /* ---------- BAN ---------- */
  function renderBan() {
    const ban = banned(), recent = recentSet();
    $("banGroups").innerHTML = ROLES.map(r => {
      const hs = S.heroes.filter(h => h.role === r).sort(byName);
      const nb = hs.filter(h => ban.has(h.id)).length;
      return `<div class="role-group" data-role="${r}">
        <h3><span class="dot"></span>${ROLE_JP[r]} <span class="n">${hs.length - nb}/${hs.length}</span><span class="spacer"></span>
          <button class="btn small" data-banrole="${r}" data-act="${nb === hs.length ? "off" : "on"}" type="button">${nb === hs.length ? "全部戻す" : "全部BAN"}</button>
          <button class="btn small" data-only="${r}" type="button">このロールだけ</button></h3>
        <div class="chips">${hs.map(h => `<button type="button" class="chip ${recent.has(h.id) ? "recent" : ""}" data-id="${h.id}" aria-pressed="${ban.has(h.id)}" title="${recent.has(h.id) ? "直近で出たので除外中" : ""}">${esc(h.name)}</button>`).join("") || '<span class="hint">登録なし</span>'}</div>
      </div>`;
    }).join("") + '<p class="hint" style="margin:0">下線オレンジ = 直近のスピンで出たヒーロー（除外ONなら今は出ない）</p>';
  }
  $("banGroups").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (chip) {
      const id = chip.dataset.id;
      S.bans = S.bans.includes(id) ? S.bans.filter(x => x !== id) : [...S.bans, id];
    }
    const br = e.target.closest("[data-banrole]");
    if (br) {
      const ids = S.heroes.filter(h => h.role === br.dataset.banrole).map(h => h.id);
      S.bans = br.dataset.act === "on" ? [...new Set([...S.bans, ...ids])] : S.bans.filter(x => !ids.includes(x));
    }
    const only = e.target.closest("[data-only]");
    if (only) S.bans = S.heroes.filter(h => h.role !== only.dataset.only).map(h => h.id);
    if (chip || br || only) { save(); renderBan(); renderStats(); }
  });
  $("banClear").addEventListener("click", () => { S.bans = []; save(); renderBan(); renderStats(); toast("BANを全解除した"); });

  /* ---------- manage ---------- */
  function renderManage() {
    $("manageGroups").innerHTML = ROLES.map(r => {
      const hs = S.heroes.filter(h => h.role === r).sort(byName);
      return `<div class="role-group" data-role="${r}">
        <h3><span class="dot"></span>${ROLE_JP[r]} <span class="n">${hs.length}</span></h3>
        <div class="rows">${hs.map(h => `<div class="row" data-id="${h.id}">
          <input class="input" id="name-${h.id}" value="${esc(h.name)}" maxlength="30" aria-label="名前">
          <select class="select" id="role-${h.id}" aria-label="ロール">${ROLES.map(x => `<option value="${x}" ${x === h.role ? "selected" : ""}>${ROLE_JP[x]}</option>`).join("")}</select>
          <button class="btn small danger del" type="button" aria-label="${esc(h.name)}を削除">削除</button>
        </div>`).join("") || '<span class="hint">登録なし</span>'}</div>
      </div>`;
    }).join("");
  }
  const mg = $("manageGroups");
  mg.addEventListener("change", e => {
    const row = e.target.closest(".row"); if (!row) return;
    const h = heroById(row.dataset.id); if (!h) return;
    if (e.target.classList.contains("input")) {
      const v = e.target.value.trim();
      if (!v) { e.target.value = h.name; return; }
      h.name = v; toast("名前を更新した");
    }
    if (e.target.classList.contains("select")) { h.role = e.target.value; toast(`${h.name} を${ROLE_JP[h.role]}に移動`); renderManage(); }
    save(); renderBan(); renderStats(); renderReels();
  });
  mg.addEventListener("click", e => {
    const del = e.target.closest(".del"); if (!del) return;
    if (!del.dataset.armed) {
      del.dataset.armed = "1"; del.classList.add("confirm"); del.textContent = "本当に？";
      setTimeout(() => { if (del.isConnected && del.dataset.armed) { delete del.dataset.armed; del.classList.remove("confirm"); del.textContent = "削除"; } }, 3000);
      return;
    }
    const id = del.closest(".row").dataset.id, h = heroById(id);
    S.heroes = S.heroes.filter(x => x.id !== id); S.bans = S.bans.filter(x => x !== id);
    save(); renderManage(); renderBan(); renderStats(); toast(`${h ? h.name : ""} を削除した`);
  });
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("addName").value.trim(), role = $("addRole").value;
    if (!name) { $("addName").focus(); return; }
    if (S.heroes.some(h => h.name === name)) { toast("同じ名前のヒーローがもういるよ"); return; }
    S.heroes.push({ id: uid(), name, role });
    $("addName").value = ""; save(); renderManage(); renderBan(); renderStats();
    toast(`${name} を${ROLE_JP[role]}に追加した`);
  });
  armConfirm($("resetBtn"), "もう一回押すとリセット", () => {
    S.heroes = defaultHeroList(); S.bans = []; lastResult = null;
    save(); renderAll(); toast("初期リストに戻した");
  });

  /* ---------- export / import ---------- */
  let modalMode = null;
  function openModal(mode) {
    modalMode = mode;
    const ta = $("modalText");
    if (mode === "export") {
      $("modalTitle").textContent = "ヒーローリストを書き出し";
      $("modalDesc").textContent = "このテキストをコピーして保存しとけば、別のブラウザや友達のところで「読み込み」できる。BANも一緒に入ってる。";
      ta.value = JSON.stringify({ heroes: S.heroes.map(h => ({ name: h.name, role: h.role })), bans: S.bans.map(id => heroById(id)?.name).filter(Boolean) }, null, 1);
      ta.readOnly = true; $("modalAction").textContent = "コピー";
    } else {
      $("modalTitle").textContent = "ヒーローリストを読み込み";
      $("modalDesc").textContent = "書き出したテキストを貼り付けて「読み込む」。今のリストは置き換わるよ。";
      ta.value = ""; ta.readOnly = false; $("modalAction").textContent = "読み込む";
    }
    $("modal").hidden = false; setTimeout(() => { ta.focus(); if (mode === "export") ta.select(); }, 30);
  }
  const closeModal = () => { $("modal").hidden = true; };
  $("exportBtn").addEventListener("click", () => openModal("export"));
  $("importBtn").addEventListener("click", () => openModal("import"));
  $("modalClose").addEventListener("click", closeModal);
  $("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("modal").hidden) closeModal(); });
  $("modalAction").addEventListener("click", () => {
    const ta = $("modalText");
    if (modalMode === "export") {
      const fallback = () => { ta.focus(); ta.select(); toast("選択したのでCtrl+Cでコピーしてね"); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast("コピーした"), fallback); } catch (e) { fallback(); }
      return;
    }
    try {
      const data = JSON.parse(ta.value);
      const list = (Array.isArray(data) ? data : data.heroes || []).filter(h => h && typeof h.name === "string" && ROLES.includes(h.role));
      if (!list.length) throw new Error("empty");
      S.heroes = list.map(h => ({ id: uid(), name: h.name.trim().slice(0, 30), role: h.role }));
      const banNames = new Set(Array.isArray(data.bans) ? data.bans : []);
      S.bans = S.heroes.filter(h => banNames.has(h.name)).map(h => h.id);
      lastResult = null; save(); renderAll(); closeModal(); toast(`${S.heroes.length}人を読み込んだ`);
    } catch (e) {
      toast("読み込めなかった。書き出したテキストをそのまま貼ってね");
    }
  });

  /* ---------- history ---------- */
  function renderHistory() {
    const el = $("histList");
    if (!S.history.length) { el.innerHTML = '<li class="empty-state" style="display:block">まだスピンしてない。SPINを押すとここに残るよ。</li>'; return; }
    const fmt = new Intl.DateTimeFormat("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    el.innerHTML = S.history.map((e, idx) => {
      const inRecent = S.recentOn && idx < S.recentN;
      return `<li class="${inRecent ? "in-recent" : ""}">
        <time>${fmt.format(e.t)} · ${esc(e.mode === "solo" ? "SOLO" : e.mode)}</time>
        <span class="picks">${e.picks.map(p => p.heroId ? `<span class="tag" data-role="${p.role}">${p.player ? `<small>${esc(p.player)}</small>` : ""}${esc(p.name)}</span>` : '<span class="tag">候補なし</span>').join("")}</span>
        ${inRecent ? '<span class="recent-flag">除外中</span>' : ""}
      </li>`;
    }).join("");
  }
  armConfirm($("histClear"), "もう一回押すと消える", () => { S.history = []; save(); renderHistory(); renderBan(); renderStats(); toast("履歴を消した"); });

  function renderAll() { renderControls(); renderReels(); renderTabs(); renderBan(); renderManage(); renderHistory(); renderStats(); }
  renderAll();
})();
</script>
</body>
</html>
